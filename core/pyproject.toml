[project]
name = "stickman-core"
version = "0.1.0"
description = "Stickman Studio's engine: plan, voice, draw and render a video, all on this Mac."
requires-python = ">=3.12,<3.13"
dependencies = [
    "kokoro-onnx>=0.6.1",
    "numpy>=2.0",
    "pillow>=11.0",
    "imageio-ffmpeg>=0.6.0",
    "keyring>=25.0",
    "segno>=1.6",
    "truststore>=0.10",
]

[dependency-groups]
dev = ["pyinstaller>=6.11"]

[tool.uv]
package = false
